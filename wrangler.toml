name = "edgepay-deploy-wizard"
main = "src/index.js"
compatibility_date = "2026-08-16"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "deploy.imsuk.cn/*", zone_name = "imsuk.eu.org" },
  # 与 deploy.imsuk.cn 同一个完整入口。同 zone 的支付站 Worker fetch 走路由的
  # deploy.imsuk.cn 会被送去 zone 源站（522），Custom Domain 不受这个限制，检查更新先走它。
  { pattern = "deploy-api.imsuk.eu.org", custom_domain = true }
]

# 向导自己没有任何持久化绑定：不碰 D1、不碰 KV，纯无状态请求/响应。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Worker 间使用 Service Binding，避免从 Cloudflare 边缘回源公开域名。
[[services]]
binding = "LICENSE_SERVICE"
service = "edgepay-license-worker"

[vars]
TEMPLATE_OWNER = "Suk-ldev"
# 私有发行仓库：只放混淆后的构建产物（core/index.js、plugins/<code>.js、schema.sql、
# COMMERCIAL_BUILD.json）。公开源码仓库不含付费插件，也构建不出可部署的 Worker。
TEMPLATE_REPO = "edgepay-payment-dist"
# 锁定的发行 commit，不跟分支自动漂移；升级发行版本时手动改这三个值。
TEMPLATE_COMMIT_SHA = "778acd696efebf236ac72169da8318387f6065d8"
TEMPLATE_VERSION = "2.1.26"
# 构建清单的 SHA-256。清单内再记录每个产物文件的哈希，钉住它即锁住整次发行。
TEMPLATE_MANIFEST_SHA256 = "4ec9088dc1be043ff62ee0aec96a49e2238779900c40d8a51bad31212285dd7a"
# 安卓监听端最新版本（APP APK 与 root 模块 zip），/api/watcher-version 读这里。
# 上架新包时与 guide.html 的"当前版本"文案一起手动推进。
WATCHER_APP_VERSION = "1.4.4"
WATCHER_MODULE_VERSION = "0.2.1"

# 发行仓库是私有的，GITHUB_TOKEN 是部署前置条件（不是限额扩容项）：
#   npx wrangler secret put GITHUB_TOKEN
# 权限要求：只读、仅限该 dist 仓库；不要给源码仓库权限，也不要给写权限。
