name = "edgepay-deploy-wizard"
main = "src/index.js"
compatibility_date = "2026-08-16"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "deploy.imsuk.cn/*", zone_name = "imsuk.eu.org" }
]

# 向导自己没有任何持久化绑定：不碰 D1、不碰 KV，纯无状态请求/响应。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Worker 间使用 Service Binding，避免从 Cloudflare 边缘回源公开域名。
[[services]]
binding = "LICENSE_SERVICE"
service = "edgepay-license-worker"

[vars]
TEMPLATE_OWNER = "Suk-ldev"
TEMPLATE_REPO = "edgepay-serverless-payment"
# 合并仓库发布后改为仓库名，并设置 TEMPLATE_SUBDIR = "payment-worker"。
# 当前独立模板仓库的根目录就是支付 Worker，因此不设置子目录。
# 锁定的模板 commit，不跟 main 分支自动漂移；升级模板版本时手动改这里。
TEMPLATE_COMMIT_SHA = "661a25f77a78097ddf73d38d0c082bc36479e94d"

# 必须：只读访问私有支付模板仓库的 GitHub Token。只通过 Worker Secret 配置，
# 不写入源码、wrangler.toml 或部署页面。
# 生产环境：wrangler secret put GITHUB_TOKEN
