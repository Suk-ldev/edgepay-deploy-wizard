name = "edgepay-deploy-wizard"
main = "src/index.js"
compatibility_date = "2026-08-16"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "deploy.imsuk.cn/*", zone_name = "imsuk.eu.org" }
]

# 向导自己没有任何持久化绑定：不碰 D1、不碰 KV，纯无状态请求/响应。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Worker 间使用 Service Binding，避免从 Cloudflare 边缘回源公开域名。
[[services]]
binding = "LICENSE_SERVICE"
service = "edgepay-license-worker"

[vars]
TEMPLATE_OWNER = "Suk-ldev"
TEMPLATE_REPO = "edgepay-serverless-payment"
# 公开商业加密发行仓库根目录就是支付 Worker，因此不设置子目录。
# 锁定的模板 commit，不跟 main 分支自动漂移；升级模板版本时手动改这里。
TEMPLATE_COMMIT_SHA = "c381279f251c2f3e0ca08051a4246981e5a196ee"
TEMPLATE_VERSION = "1.1.0"
TEMPLATE_ENTRY_SHA256 = "2d56bff850e1ec853b523e720ab24381770e65affea1af465dd0da3bbf0efd8b"
TEMPLATE_SCHEMA_SHA256 = "6da91cb521300e9ec3e119c91bebbd4ff8f957456d844a6c1177573b3756835d"

# 支付模板仓库是公开商业加密发行仓库，默认匿名读取固定 commit。
# GITHUB_TOKEN 仅作为可选的 GitHub API 限额扩容项，不是部署前置条件。
